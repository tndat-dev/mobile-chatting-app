apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

patches:
  - target:
      kind: Deployment
      name: chat-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: chat_app_staging

secretGenerator:
  - name: chat-server-secret
    behavior: merge
    literals:
      - db-conn-str="host=staging-postgres-service port=5432 dbname=chat_app_staging user=chat_app_user password=chat_app_password"
