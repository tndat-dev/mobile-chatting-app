resources:
  - deployment.yaml
  - service.yaml
  - postgres-statefulset.yaml

secretGenerator:
  - name: chat-server-secret
    literals:
      - db-conn-str="host=dev-postgres-service port=5432 dbname=chat_app_dev user=chat_app_user password=chat_app_password"
  - name: postgres-secret
    literals:
      - postgres-password=chat_app_password

configMapGenerator:
  - name: postgres-schema-config
    files:
      - schema.sql
