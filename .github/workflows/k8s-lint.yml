name: Kubernetes Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run kube-linter (base)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            stackrox/kube-linter:latest \
            lint --config /work/server-cpp/k8s/.kube-linter.yaml /work/server-cpp/k8s/base

      - name: Run kube-linter (overlays)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            stackrox/kube-linter:latest \
            lint --config /work/server-cpp/k8s/.kube-linter.yaml /work/server-cpp/k8s/overlays
